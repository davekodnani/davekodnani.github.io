<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCE Inflation Breadth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --surface: #ffffff;
  --panel: #f5f5f3;
  --ink: #2b2b2b;
  --ink-2: #5b5b58;
  --ink-3: #8a8a86;
  --rule: #d6d6d2;
  --grid: #c4c4c0;
  --cat: #1f4e79;
  --spend: #9a9a9a;
  --accent: #1f4e79;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #18191b; --panel: #232427; --ink: #f1f1ee; --ink-2: #c3c2bb; --ink-3: #8d8c86;
    --rule: #3a3b3e; --grid: #4a4b4f; --cat: #6da7ec; --spend: #8f8f8a; --accent: #6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #18191b; --panel: #232427; --ink: #f1f1ee; --ink-2: #c3c2bb; --ink-3: #8d8c86;
  --rule: #3a3b3e; --grid: #4a4b4f; --cat: #6da7ec; --spend: #8f8f8a; --accent: #6da7ec;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink);
  font: 15px/1.45 Lato, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 21px; font-weight: 400; margin: 0 0 4px; }
.sub { color: var(--ink-2); margin: 0 0 18px; font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; margin-bottom: 14px; }
.ctl label, .ctl .lbl { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; letter-spacing: .02em; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; background: transparent; color: var(--ink); border: 0;
  padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.thr { display: flex; align-items: center; gap: 6px; }
.thr input[type=number] { width: 70px; font: inherit; padding: 5px 6px; border: 1px solid var(--rule);
  border-radius: 8px; background: var(--surface); color: var(--ink); }
.thr input[type=range] { width: 130px; accent-color: var(--accent); }
select { font: inherit; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--surface); color: var(--ink); }
.chart { position: relative; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { fill: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-dasharray: 1 3; }
.baseline { stroke: var(--ink-2); }
.avg { stroke: var(--cat); stroke-dasharray: 5 3; stroke-width: 1.2; }
.avg.spend { stroke: var(--spend); }
.line { fill: none; stroke-width: 2.6; stroke-linejoin: round; }
.lbl-end { font-weight: 700; font-size: 15px; }
.lbl-avg { font-size: 12.5px; }
.xhair { stroke: var(--ink-3); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 150px; display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.tip .d { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .k { width: 14px; height: 0; border-top: 2.5px solid; }
.tip b { font-variant-numeric: tabular-nums; min-width: 38px; }
.tip span.n { color: var(--ink-2); }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--ink-2); margin: 4px 0 0; }
.legend i { display: inline-block; width: 18px; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
.note { color: var(--ink-2); font-size: 12.5px; margin-top: 10px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 6px 0 12px; }
.stat .v { font-size: 30px; font-weight: 700; line-height: 1.1; }
.stat .t { font-size: 12px; color: var(--ink-2); }
details { margin-top: 18px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
table { border-collapse: collapse; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 12px 3px 0; text-align: right; border-bottom: 1px solid var(--rule); }
th:first-child, td:first-child { text-align: left; }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: transparent; color: var(--ink);
  border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.tbl-wrap { max-height: 360px; overflow: auto; }
.explain { background: var(--panel); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
  padding: 10px 14px; margin: 0 0 16px; font-size: 14px; color: var(--ink-2); }
.explain p { margin: 0; }
.explain p + p { margin-top: 6px; }
.explain b { color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1 id="title">Share of PCE with 12-month price increases at or above 3 percent</h1>
  <p class="sub" id="sub"></p>

  <div class="controls">
    <div class="ctl">
      <span class="lbl">Threshold (at or above)</span>
      <div class="thr">
        <input type="range" id="thrR" min="0" max="10" step="0.25" value="3" aria-label="Threshold slider">
        <input type="number" id="thrN" min="-10" max="50" step="0.25" value="3" aria-label="Threshold percent"> %
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">Horizon</span>
      <div class="seg" id="hz">
        <button data-v="12" aria-pressed="true">12m</button>
        <button data-v="6" aria-pressed="false">6m ann.</button>
        <button data-v="3" aria-pressed="false">3m ann.</button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">Share of</span>
      <div class="seg" id="wt">
        <button data-v="u" aria-pressed="true" title="Each of the 177 categories counts equally">Categories</button>
        <button data-v="w" aria-pressed="false" title="Categories weighted by their share of consumer spending">Spending</button>
        <button data-v="b" aria-pressed="false">Both</button>
      </div>
    </div>
    <div class="ctl">
      <label for="start">Start</label>
      <select id="start"></select>
    </div>
    <div class="ctl">
      <button class="btn" id="png">Download PNG</button>
    </div>
  </div>
  <div class="explain" id="explain"></div>

  <div class="stats" id="stats"></div>
  <div class="chart" id="chart"><svg id="svg" role="img" aria-labelledby="title"></svg><div class="tip" id="tip"></div></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="note"></p>

  <details>
    <summary>Data table</summary>
    <p><button class="btn" id="dl">Download CSV (this view)</button></p>
    <div class="tbl-wrap"><table id="tbl"></table></div>
  </details>
</main>

<script>
const D = /*__DATA__*/null;
const T = D.dates.length, N = D.names.length;
const state = { thr: 3, h: 12, wt: "u", start: "2000" };
const $ = id => document.getElementById(id);

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LONGM = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDate = s => MONTHS[+s.slice(5) - 1] + " " + s.slice(0, 4);

// Growth rates cached per horizon (percent, annualized for < 12m).
const growthCache = {};
function growth(h) {
  if (growthCache[h]) return growthCache[h];
  const out = D.prices.map(p => {
    const g = new Float64Array(T).fill(NaN);
    for (let t = h; t < T; t++) {
      const a = p[t], b = p[t - h];
      if (a != null && b != null && b > 0) g[t] = (Math.pow(a / b, 12 / h) - 1) * 100;
    }
    return g;
  });
  return (growthCache[h] = out);
}

function breadth(h, thr, weighted) {
  const G = growth(h), s = new Float64Array(T).fill(NaN);
  for (let t = 0; t < T; t++) {
    let num = 0, den = 0;
    for (let i = 0; i < N; i++) {
      const g = G[i][t];
      if (Number.isNaN(g)) continue;
      const w = weighted ? D.nominal[i][t] : 1;
      if (w == null) continue;
      den += w;
      if (g >= thr) num += w;
    }
    if (den > 0) s[t] = num / den * 100;
  }
  return s;
}

function mean(s, a, b) {
  let sum = 0, n = 0;
  for (let t = 0; t < T; t++) if (D.dates[t] >= a && D.dates[t] <= b && !Number.isNaN(s[t])) { sum += s[t]; n++; }
  return n ? sum / n : NaN;
}

function series() {
  const out = [];
  if (state.wt !== "w") out.push({ key: "u", name: "Share of categories", cls: "cat", s: breadth(state.h, state.thr, false) });
  if (state.wt !== "u") out.push({ key: "w", name: "Share of spending", cls: "spend", s: breadth(state.h, state.thr, true) });
  return out;
}

function hzText() { return state.h === 12 ? "12-month" : state.h + "-month annualized"; }

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

let current = null;
function writeHash() {
  history.replaceState(null, "", `#h=${state.h}&w=${state.wt}&t=${state.thr}&s=${state.start}`);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if ([12, 6, 3].includes(+p.get("h"))) state.h = +p.get("h");
  if (["u", "w", "b"].includes(p.get("w"))) state.wt = p.get("w");
  if (p.get("t") !== null && Number.isFinite(parseFloat(p.get("t")))) state.thr = parseFloat(p.get("t"));
  if (/^\d{4}$/.test(p.get("s") || "")) state.start = p.get("s");
}

function countAbove(t) {
  const G = growth(state.h); let n = 0, k = 0;
  for (let i = 0; i < N; i++) { const g = G[i][t]; if (Number.isNaN(g)) continue; k++; if (g >= state.thr) n++; }
  return [n, k];
}

const DEF = {
  u: "each of the 177 categories counts equally, so the share is simply how many categories are at or above the threshold",
  w: "each category counts by its share of consumer spending, so big-budget items like housing and health care matter far more than small ones like watches or toys",
};
function hzPhrase() { return state.h === 12 ? "over the past 12 months" : `over the past ${state.h} months (annualized)`; }

function explain(S, last) {
  const box = $("explain"); box.replaceChildren();
  const when = fmtDate(D.dates[last]);
  const para = (label, rest) => { const p = document.createElement("p"); const b = document.createElement("b");
    b.textContent = label; p.append(b, document.createTextNode(rest)); box.appendChild(p); };
  const v = k => S.find(x => x.key === k).s[last];
  if (state.wt !== "w") {
    const [n, k] = countAbove(last);
    para("Share of categories: ", `${DEF.u}. In ${when}, ${n} of ${k} categories (${v("u").toFixed(0)}%) had prices up ${state.thr}% or more ${hzPhrase()}.`);
  }
  if (state.wt !== "u") {
    para("Share of spending: ", `${DEF.w}. In ${when}, categories making up ${v("w").toFixed(0)}% of consumer spending had prices up ${state.thr}% or more ${hzPhrase()}.`);
  }
  if (state.wt === "b") {
    const gap = v("w") - v("u");
    para("Reading the gap: ", Math.abs(gap) < 3
      ? "the two lines are close, so above-threshold inflation is spread about evenly across big and small categories."
      : gap > 0
        ? "spending is above categories, so above-threshold inflation is concentrated in the large categories that make up more of household budgets."
        : "spending is below categories, so above-threshold inflation is mostly in smaller categories while big-budget items are running cooler.");
  }
}

function render(opts = {}) {
  writeHash();
  const S = series();
  const i0 = Math.max(D.dates.findIndex(d => d >= state.start + "-01"), 0);
  const idx = []; for (let t = i0; t < T; t++) if (S.some(x => !Number.isNaN(x.s[t]))) idx.push(t);
  current = { S, idx };

  const subj = state.wt === "u" ? "PCE categories" : state.wt === "w" ? "PCE spending" : "PCE";
  $("title").textContent = `Share of ${subj} with ${hzText()} price increases at or above ${state.thr} percent`;
  $("sub").textContent = `177 detailed PCE categories · data through ${LONGM[+D.latest.slice(5) - 1]} ${D.latest.slice(0, 4)}`;

  // Stat row: latest value per series with change vs prior month.
  const st = $("stats"); st.replaceChildren();
  const last = idx[idx.length - 1];
  for (const x of S) {
    const d = document.createElement("div"); d.className = "stat";
    const v = document.createElement("div"); v.className = "v"; v.textContent = x.s[last].toFixed(0) + "%";
    const t = document.createElement("div"); t.className = "t";
    const ch = x.s[last] - x.s[last - 1];
    t.textContent = `${x.name.toLowerCase()}, ${fmtDate(D.dates[last])} (${ch >= 0 ? "+" : "−"}${Math.abs(ch).toFixed(1)} pp m/m)`;
    d.append(v, t); st.appendChild(d);
  }

  explain(S, idx[idx.length - 1]);
  const W = opts.width || Math.round(Math.min(940, Math.max(340, $("chart").clientWidth || 940)));
  const narrow = W < 600, H = narrow ? Math.round(W * 0.78) : 520;
  const m = { l: 40, r: narrow ? 64 : 118, t: 16, b: 34 };
  const svg = $("svg"); svg.replaceChildren(); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const y0 = +D.dates[idx[0]].slice(0, 4), yLast = +D.dates[last].slice(0, 4);
  const span = yLast + 2 - y0, per = narrow ? 2 : 1;
  const step = span > 40 * per ? 10 * per : span > 20 * per ? 4 * per : span > 10 * per ? 2 * per : per;
  const xa = y0 - (y0 % step), xb = Math.ceil((yLast + 1.5) / step) * step;
  const tnum = s => +s.slice(0, 4) + (+s.slice(5) - 1) / 12;
  const x = v => m.l + (v - xa) / (xb - xa) * iw;
  let vmax = 0; for (const s of S) for (const t of idx) if (s.s[t] > vmax) vmax = s.s[t];
  const top = vmax <= 84 ? 80 : Math.ceil(vmax / 20) * 20;  // plot runs to top + 4
  const y = v => m.t + ih - v / (top + 4) * ih;

  const ax = el("g", { class: "axis" }, svg);
  for (let v = 0; v <= top; v += 20) {
    if (v > 0) el("line", { class: "gridline", x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v) }, ax);
    el("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, ax, v === top ? v + "%" : v);
  }
  el("line", { class: "baseline", x1: m.l, x2: m.l + iw, y1: y(0), y2: y(0) }, ax);
  for (let yr = xa; yr <= xb; yr += step) {
    el("line", { class: "baseline", x1: x(yr), x2: x(yr), y1: y(0), y2: y(0) + 5 }, ax);
    el("text", { x: x(yr), y: y(0) + 22, "text-anchor": "middle" }, ax, yr);
  }

  const [a0, a1] = D.avgWindow;
  const labels = [];
  for (const s of S) {
    const col = `var(--${s.cls})`;
    const avg = mean(s.s, a0, a1);
    el("line", { class: "avg" + (s.cls === "spend" ? " spend" : ""), x1: m.l, x2: m.l + iw, y1: y(avg), y2: y(avg) }, svg);
    labels.push({ y: y(avg), text: narrow ? [`avg ${avg.toFixed(0)}%`] : [`${a0.slice(0,4)}–${a1.slice(0,4)}`, `avg: ${avg.toFixed(0)}%`], col, cls: "lbl-avg" });
    let d = "", pen = false;
    for (const t of idx) {
      const v = s.s[t];
      if (Number.isNaN(v)) { pen = false; continue; }
      d += (pen ? "L" : "M") + x(tnum(D.dates[t])).toFixed(1) + "," + y(v).toFixed(1);
      pen = true;
    }
    el("path", { class: "line", d, stroke: col }, svg);
    labels.push({ y: y(s.s[last]), text: [s.s[last].toFixed(0) + "%"], col, cls: "lbl-end", end: true });
  }
  // Right-margin labels, nudged apart so they never collide.
  labels.sort((p, q) => p.y - q.y);
  for (let i = 1; i < labels.length; i++) {
    const need = labels[i - 1].text.length * 15 + 4;
    if (labels[i].y - labels[i - 1].y < need) labels[i].y = labels[i - 1].y + need;
  }
  const lx = x(tnum(D.dates[last])) + 8;
  for (const L of labels) {
    const tx = el("text", { x: L.end ? lx : m.l + iw + 6, y: L.y + (L.text.length > 1 ? -2 : 5), class: L.cls, fill: L.col }, svg);
    L.text.forEach((line, k) => el("tspan", { x: L.end ? lx : m.l + iw + 6, dy: k ? 15 : 0 }, tx, line));
  }

  // Hover layer.
  const xh = el("line", { class: "xhair", y1: m.t, y2: y(0), visibility: "hidden" }, svg);
  const dots = S.map(s => el("circle", { r: 4.5, fill: `var(--${s.cls})`, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg));
  const hit = el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent", tabindex: 0 }, svg);
  const tip = $("tip");
  let focusIdx = idx.length - 1;
  function show(k) {
    focusIdx = Math.max(0, Math.min(idx.length - 1, k));
    const t = idx[focusIdx], px = x(tnum(D.dates[t]));
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    tip.replaceChildren();
    const dd = document.createElement("div"); dd.className = "d"; dd.textContent = fmtDate(D.dates[t]); tip.appendChild(dd);
    S.forEach((s, j) => {
      const v = s.s[t];
      dots[j].setAttribute("cx", px); dots[j].setAttribute("cy", y(v));
      dots[j].setAttribute("visibility", Number.isNaN(v) ? "hidden" : "visible");
      const r = document.createElement("div"); r.className = "r";
      const k2 = document.createElement("span"); k2.className = "k"; k2.style.borderColor = `var(--${s.cls})`;
      const b = document.createElement("b"); b.textContent = Number.isNaN(v) ? "–" : v.toFixed(1) + "%";
      const n = document.createElement("span"); n.className = "n"; n.textContent = s.name;
      r.append(k2, b, n); tip.appendChild(r);
    });
    const box = svg.getBoundingClientRect(), sc = box.width / W;
    tip.style.display = "block";
    const left = px * sc + 14;
    tip.style.left = (left + tip.offsetWidth > box.width ? px * sc - tip.offsetWidth - 14 : left) + "px";
    tip.style.top = (m.t * sc + 6) + "px";
  }
  function hide() { xh.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); tip.style.display = "none"; }
  hit.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect(), vx = (e.clientX - box.left) * W / box.width;
    const target = xa + (vx - m.l) / iw * (xb - xa);
    let best = 0, bd = Infinity;
    idx.forEach((t, k) => { const dd = Math.abs(tnum(D.dates[t]) - target); if (dd < bd) { bd = dd; best = k; } });
    show(best);
  });
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("focus", () => show(focusIdx));
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { show(focusIdx - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(focusIdx + 1); e.preventDefault(); }
  });

  // Legend (always present) + footnote.
  const lg = $("legend"); lg.replaceChildren();
  S.forEach(s => { const sp = document.createElement("span"); const i = document.createElement("i");
    i.style.borderColor = `var(--${s.cls})`; sp.append(i, document.createTextNode(s.name)); lg.appendChild(sp); });
  { const sp = document.createElement("span"); const i = document.createElement("i");
    i.style.borderTop = "1.5px dashed var(--ink-2)"; sp.append(i, document.createTextNode(`${a0.slice(0,4)}–${a1.slice(0,4)} average`)); lg.appendChild(sp); }
  $("note").textContent = `Source: BEA Tables 2.4.4U and 2.4.5U; calculations from the 177 detailed PCE categories used in the Dallas Fed trimmed mean. ` +
    `"Share of spending" weights each category by its current-month nominal expenditure. Built ${D.fetched.replace("T", " ")}.`;

  // Table (newest first).
  const tb = $("tbl"); tb.replaceChildren();
  const hr = tb.insertRow(); ["Month", ...S.map(s => s.name)].forEach(h => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  for (let k = idx.length - 1; k >= 0; k--) {
    const t = idx[k], r = tb.insertRow();
    r.insertCell().textContent = D.dates[t];
    S.forEach(s => { r.insertCell().textContent = Number.isNaN(s.s[t]) ? "" : s.s[t].toFixed(1); });
  }
}

// ---- PNG export: redraw at a fixed width in the light theme, inline the computed
// styles, wrap with title / definition / legend / attribution, rasterize at 2x.
let fontCSS = null;
async function embeddedLato() {
  if (fontCSS !== null) return fontCSS;
  fontCSS = "";
  try {
    const css = await (await fetch("https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap")).text();
    const faces = css.split("/* ").filter(b => b.startsWith("latin */"));
    for (const face of faces) {
      const url = (face.match(/url\((https:[^)]+)\)/) || [])[1], wt = (face.match(/font-weight:\s*(\d+)/) || [])[1];
      if (!url) continue;
      const blob = await (await fetch(url)).blob();
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      fontCSS += `@font-face{font-family:Lato;font-weight:${wt};src:url(${data}) format("woff2");}`;
    }
  } catch (_) { fontCSS = ""; }
  return fontCSS;
}

function wrapText(text, size, weight, maxW) {
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = `${weight} ${size}px Lato, Helvetica, Arial, sans-serif`;
  const lines = []; let line = "";
  for (const w of text.split(" ")) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

async function downloadPNG() {
  const btn = $("png"); btn.disabled = true; btn.textContent = "Preparing…";
  const root = document.documentElement, prevTheme = root.getAttribute("data-theme");
  const EW = 1000, PAD = 40, OUTW = EW + 2 * PAD;
  let clone, vbH, col = {};
  // Synchronous block: switch theme, redraw, capture, restore -- no repaint in between.
  root.setAttribute("data-theme", "light");
  try {
    render({ width: EW });
    const src = $("svg");
    vbH = +src.getAttribute("viewBox").split(" ")[3];
    clone = src.cloneNode(true);
    const orig = src.querySelectorAll("*"), copy = clone.querySelectorAll("*");
    const props = ["fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linejoin", "font-size", "font-weight"];
    orig.forEach((o, i) => {
      const c = copy[i];
      if (o.tagName === "rect" || o.getAttribute("visibility") === "hidden") { c.setAttribute("data-drop", "1"); return; }
      const st = getComputedStyle(o);
      props.forEach(p => c.style.setProperty(p, st.getPropertyValue(p)));
      c.removeAttribute("class");
    });
    clone.querySelectorAll("[data-drop]").forEach(e => e.remove());
    const rs = getComputedStyle(root);
    ["ink", "ink-2", "cat", "spend", "surface"].forEach(k => col[k] = rs.getPropertyValue("--" + k).trim());
  } finally {
    if (prevTheme === null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", prevTheme);
    render();
  }

  const S = current.S, month = D.latest;
  const title = $("title").textContent;
  const def = state.wt === "u" ? "Share of categories: " + DEF.u + "."
            : state.wt === "w" ? "Share of spending: " + DEF.w + "."
            : "Share of categories counts each of the 177 categories equally; share of spending weights each by its share of consumer spending.";
  const src = `Source: U.S. Bureau of Economic Analysis, PCE price indexes and spending by type of product (Tables 2.4.4U and 2.4.5U); ` +
              `calculations over the 177 detailed PCE categories used in the Dallas Fed trimmed mean. Data through ${LONGM[+month.slice(5) - 1]} ${month.slice(0, 4)}.`;
  const tL = wrapText(title, 26, 400, OUTW - 2 * PAD), dL = wrapText(def, 15, 400, OUTW - 2 * PAD), sL = wrapText(src, 13, 400, OUTW - 2 * PAD);

  const NS2 = "http://www.w3.org/2000/svg";
  const out = document.createElementNS(NS2, "svg");
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let y = PAD + 26, parts = [];
  tL.forEach(l => { parts.push(`<text x="${PAD}" y="${y}" font-size="26" fill="${col.ink}">${esc(l)}</text>`); y += 33; });
  y += 2;
  dL.forEach(l => { parts.push(`<text x="${PAD}" y="${y}" font-size="15" fill="${col["ink-2"]}">${esc(l)}</text>`); y += 21; });
  y += 12;
  const chartY = y;
  y += vbH + 22;
  let lx = PAD;
  const key = (color, dash, label) => {
    parts.push(`<line x1="${lx}" x2="${lx + 22}" y1="${y - 5}" y2="${y - 5}" stroke="${color}" stroke-width="${dash ? 1.5 : 3}"${dash ? ' stroke-dasharray="5 3"' : ""}/>`);
    parts.push(`<text x="${lx + 30}" y="${y}" font-size="14" fill="${col["ink-2"]}">${esc(label)}</text>`);
    lx += 30 + wrapText(label, 14, 400, 1e9)[0].length * 7.2 + 28;
  };
  S.forEach(s => key(col[s.cls], false, s.name));
  key(col["ink-2"], true, `${D.avgWindow[0].slice(0, 4)}–${D.avgWindow[1].slice(0, 4)} average`);
  y += 30;
  sL.forEach(l => { parts.push(`<text x="${PAD}" y="${y}" font-size="13" fill="${col["ink-2"]}">${esc(l)}</text>`); y += 18; });
  y += 4;
  parts.push(`<text x="${PAD}" y="${y}" font-size="13" font-weight="700" fill="${col.ink}">Chart: Devesh Kodnani</text>`);
  const OUTH = y + PAD - 10;

  clone.setAttribute("x", PAD); clone.setAttribute("y", chartY);
  clone.setAttribute("width", EW); clone.setAttribute("height", vbH);
  clone.removeAttribute("role"); clone.removeAttribute("aria-labelledby"); clone.removeAttribute("id");
  const css = await embeddedLato();
  const svgText = `<svg xmlns="${NS2}" width="${OUTW}" height="${OUTH}" viewBox="0 0 ${OUTW} ${OUTH}" ` +
    `font-family="Lato, Helvetica, Arial, sans-serif"><style>${css}</style>` +
    `<rect width="100%" height="100%" fill="#ffffff"/>${parts.join("")}` +
    new XMLSerializer().serializeToString(clone) + `</svg>`;

  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej;
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText); });
    const scale = 2, cv = document.createElement("canvas");
    cv.width = OUTW * scale; cv.height = OUTH * scale;
    const ctx = cv.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    const wname = { u: "categories", w: "spending", b: "both" }[state.wt];
    a.download = `pce_breadth_${state.h}m_${wname}_${String(state.thr).replace(".", "p")}pct_${month}.png`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } finally {
    btn.disabled = false; btn.textContent = "Download PNG";
  }
}

function downloadCSV() {
  const { S, idx } = current;
  const rows = [["month", ...S.map(s => `${s.key === "u" ? "unweighted" : "weighted"}_${state.h}m_ge${state.thr}pct`)]];
  idx.forEach(t => rows.push([D.dates[t], ...S.map(s => Number.isNaN(s.s[t]) ? "" : s.s[t].toFixed(2))]));
  const blob = new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `pce_breadth_${state.h}m_${state.wt}_${state.thr}pct.csv`; a.click();
}

// Controls.
function seg(id, key, parse) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(id).children].forEach(c => c.setAttribute("aria-pressed", c === b));
    state[key] = parse(b.dataset.v); render();
  });
}
seg("hz", "h", Number); seg("wt", "wt", String);
function setThr(v) { if (!Number.isFinite(v)) return; state.thr = v; $("thrN").value = v; $("thrR").value = Math.max(0, Math.min(10, v)); render(); }
$("thrR").addEventListener("input", e => setThr(parseFloat(e.target.value)));
$("thrN").addEventListener("change", e => setThr(parseFloat(e.target.value)));
const sel = $("start");
const firstYr = +D.dates[13].slice(0, 4);
[firstYr, 1970, 1980, 1990, 2000, 2010, 2015, 2019, 2022].filter((v, i, a) => v >= firstYr && a.indexOf(v) === i).forEach(yv => {
  const o = document.createElement("option"); o.value = yv; o.textContent = yv; if (yv === 2000) o.selected = true; sel.appendChild(o);
});
sel.addEventListener("change", e => { state.start = e.target.value; render(); });
$("dl").addEventListener("click", downloadCSV);
$("png").addEventListener("click", () => downloadPNG().catch(e => { console.error(e); $("png").disabled = false; $("png").textContent = "Download PNG"; }));
function syncControls() {
  [...$("hz").children].forEach(c => c.setAttribute("aria-pressed", +c.dataset.v === state.h));
  [...$("wt").children].forEach(c => c.setAttribute("aria-pressed", c.dataset.v === state.wt));
  $("thrN").value = state.thr; $("thrR").value = Math.max(0, Math.min(10, state.thr));
  if (![...sel.options].some(o => o.value === state.start)) {
    const o = document.createElement("option"); o.value = o.textContent = state.start; sel.appendChild(o);
  }
  sel.value = state.start;
}
readHash(); syncControls(); render();
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });
</script>
