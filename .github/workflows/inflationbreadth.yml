name: Update inflation breadth

on:
  schedule:
    # GitHub often starts scheduled runs late (we've seen 5+ hours), so rather than one
    # long poll we fire many short ones. Minutes avoid :00, when GitHub's queue is busiest.
    # 12:07-15:52 UTC every 15 min covers the 8:30am ET release in both EDT (12:30 UTC)
    # and EST (13:30 UTC); hourly runs after that catch late releases and late starts.
    - cron: "7,22,37,52 12-15 * * 1-5"
    - cron: "17 16-23 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Refetch and republish even if BEA has nothing new"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Manual runs get their own queue so a scheduled run can never bump a pending one.
  group: inflationbreadth-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: _tools/inflationbreadth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas==2.3.3 requests cryptography

      - name: Wait for new BEA data and build
        id: build
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          SKIP_PNG: "1"
          FORCE: ${{ inputs.force }}
        run: |
          set +e
          if [ "$FORCE" = "true" ]; then
            python pce_breadth.py update
          else
            # Quick check on ordinary days; on release-due days poll every 30s for up to 25 min
            # (the next scheduled run picks up from there).
            python pce_breadth.py auto --minutes 25 --interval 30
          fi
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "updated=true" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 3 ]; then echo "updated=false" >> "$GITHUB_OUTPUT"
          else exit $rc; fi

      - name: Encrypt and publish
        if: steps.build.outputs.updated == 'true'
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          python gate.py charts/pce_breadth.html ../../inflationbreadth/index.html
          month=$(python -c "import json;print(json.load(open('data/raw/meta.json'))['latest_month'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../../inflationbreadth/index.html data/raw/meta.json
          git commit -m "Inflation breadth: update through $month"
          git pull --rebase
          git push
